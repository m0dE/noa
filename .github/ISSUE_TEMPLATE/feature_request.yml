name: Feature request
description: Something Noa should do
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What you want to do
      description: The task or workflow, in your own words.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: How Noa handles it now, or why it can't.
