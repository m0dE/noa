name: Bug report
description: Noa did something wrong or broke
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Leave out passwords, API keys and anything personal from the pages Noa worked on. Security problems go privately, see SECURITY.md.
  - type: textarea
    id: task
    attributes:
      label: What you asked Noa to do
      placeholder: "Post a thread on X about ..."
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: Which AI runs your tasks
      options:
        - Noa AI
        - Local Claude Code
        - Claude API
        - Auto
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Noa version
      description: "Shown in chrome://extensions"
      placeholder: "0.2.9"
  - type: input
    id: system
    attributes:
      label: Chrome version and operating system
      placeholder: "Chrome 141, macOS 26"
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots of the run or the side panel help.
